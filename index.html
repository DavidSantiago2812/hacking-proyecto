<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login
</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <div class="brand-side">
      <svg class="logo" viewBox="0 0 36 36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 0C8.06 0 0 8.06 0 18c0 8.98 6.58 16.42 15.19 17.78V23.2h-4.57v-5.2h4.57v-3.96c0-4.51 2.69-7 6.8-7 1.97 0 4.03.35 4.03.35v4.43h-2.27c-2.24 0-2.94 1.39-2.94 2.82v3.36h5.01l-.8 5.2h-4.21v12.58C29.42 34.42 36 26.98 36 18 36 8.06 27.94 0 18 0z"/>
      </svg>
      <h1>Descubre <span class="accent">lo que más te interesa.</span></h1>
    </div>

    <div class="form-side">
      <h2>Iniciar sesión</h2>
      <form id="demoForm">
        <input class="field" type="text" id="username"placeholder="Correo electrónico o usuario" autocomplete="off">
        <input class="field" type="password" id="password" placeholder="Contraseña" autocomplete="off">
        <button onclick="enviar('/api/registro')" class="btn-primary" >Iniciar sesión</button>
        <div id="status" class="status"></div>
      </form>
      <a class="forgot" href="#" onclick="return false;">¿Olvidaste tu contraseña?</a>
      <hr>
      <a class="btn-secondary" href="#" onclick="return false;">Crear cuenta nueva</a>
      <div class="footnote"></div>
    </div>

  </div>
  <script>
    async function enviar(ruta) {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const mensaje = document.getElementById('mensaje');

      try {
        const res = await fetch(ruta, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        mensaje.textContent = data.mensaje || data.error;
      } catch (err) {
        mensaje.textContent = 'Error al conectar con el servidor';
      }
    }
  </script>


</body>
</html>
